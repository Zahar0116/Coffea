    <style>/* ===== Cart page — Veranda ===== */
:root {
    --v-bg: #e0cfc0;
    --v-green: #133f38;
    --v-card: #d9d9d9;
    --v-text: #000;
    --v-minus: #ff0000;
    --v-plus: #00ff00;
    --v-radius: 12px;
}

body {
    background: var(--v-bg);
    font-family: "Montserrat", sans-serif;
    color: var(--v-text);
}

/* ---------- Header (remove if already in style.css) ---------- */
header { 
    padding-top: 34px; 
    position: static;
}

.navbar {
    max-width: 1366px;
    margin-inline: auto;
    padding: 0;
    background: var(--v-green);
    border-radius: var(--v-radius);
}
.navbar > .container { padding: 14px 16px; }

.navbar-brand {
    font-family: "Cinzel", serif;
    font-weight: 600;
    font-size: 2.2rem;
    line-height: 1;
    letter-spacing: .02em;
    text-transform: uppercase;
    color: #fff;
}
.navbar-brand:hover, .navbar-brand:focus { color: #fff; }

.navbar-nav { gap: 1.5rem; margin-inline: auto !important; }
.navbar .nav-link {
    font-size: .95rem;
    font-weight: 500;
    color: #fff;
}
.navbar .nav-link:hover,
.navbar .nav-link:focus-visible { color: #e0cfc0; }

.navbar-toggler { border-color: rgba(255,255,255,.5); }
.navbar-toggler-icon { filter: invert(1); }

.navbar .cart {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    background: #fff;
    border-radius: 50%;
    transition: transform .15s ease;
}
.navbar .cart:hover { transform: scale(1.06); }
.navbar .cart img { width: 26px; height: 26px; }

/* ---------- Cart ---------- */
.cart-page {
    max-width: 1366px;
    margin-top: clamp(48px, 10vw, 146px);
    padding-bottom: 80px;
}

.cart-list {
    display: flex;
    flex-direction: column;
    gap: 24px;
    margin: 0;
    padding: 0;
    list-style: none;
}

.cart-item {
    display: grid;
    grid-template-columns: 243px 1fr;
    min-height: 249px;
    background: var(--v-card);
    overflow: hidden;
}

.cart-item__img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.cart-item__body {
    display: flex;
    flex-direction: column;
    padding: 28px 34px;
}

.cart-item__name {
    margin: 0 0 18px;
    font-size: clamp(1.6rem, 3vw, 2.5rem);
    font-weight: 700;
    text-transform: uppercase;
    line-height: 1.1;
}

.cart-item__desc {
    margin: 0;
    max-width: 70ch;
    font-size: 1.1rem;
    font-weight: 600;
    text-transform: uppercase;
}

.cart-item__footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-top: auto;
    padding-top: 24px;
}

.cart-item__price {
    margin: 0;
    font-size: 1.35rem;
    font-weight: 700;
}

/* Quantity: red (−)  12  green (+) */
.qty {
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.qty__btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    font-size: 1.4rem;
    font-weight: 700;
    line-height: 1;
    color: #000;
    cursor: pointer;
    transition: transform .12s ease, filter .12s ease;
}
.qty__btn--minus { background: var(--v-minus); }
.qty__btn--plus  { background: var(--v-plus); }
.qty__btn:hover { transform: scale(1.08); filter: brightness(.95); }
.qty__btn:active { transform: scale(.94); }
.qty__btn:focus-visible { outline: 3px solid var(--v-green); outline-offset: 3px; }

.qty__value {
    min-width: 2ch;
    text-align: center;
    font-size: 1.35rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
}

/* Summary */
.cart-summary {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 24px;
    margin-top: 32px;
}
.cart-summary[hidden], .cart-empty[hidden] { display: none; }

.cart-summary__total {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 600;
}
.cart-summary__total strong { font-weight: 800; }

.cart-summary__checkout {
    padding: 14px 40px;
    border: 0;
    border-radius: var(--v-radius);
    background: var(--v-green);
    color: #fff;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: background-color .15s ease;
}
.cart-summary__checkout:hover { background: #0d2d28; }
.cart-summary__checkout:focus-visible { outline: 3px solid var(--v-green); outline-offset: 3px; }

.cart-empty {
    padding: 64px 0;
    text-align: center;
    font-size: 1.25rem;
    font-weight: 600;
}
.cart-empty a { display: block; margin-top: 8px; color: var(--v-green); }

/* ---------- Responsive ---------- */
@media (max-width: 991.98px) {
    .navbar-nav { margin: 1rem 0 !important; gap: .25rem; }
    .navbar .cart { margin-bottom: .5rem; }
}

@media (max-width: 575.98px) {
    .cart-item { grid-template-columns: 1fr; }
    .cart-item__img { height: 220px; }
    .cart-item__body { padding: 20px; }
    .cart-summary { justify-content: space-between; }
}

@media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
}</style>
